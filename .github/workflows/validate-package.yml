name: Validate package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release packaging
        run: python3 scripts/test_release.py
      - name: Validate package and create ZIP
        run: python3 scripts/build_release.py
